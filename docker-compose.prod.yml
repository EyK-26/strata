# Optional generated acceptance-image stack, not a product deployment manifest.
# Run migrations explicitly as a separate service; HTTP/workers receive no admin URL.
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV to local or production}
      APP_DEBUG: "false"
      AUTH_DEV_HEADERS: "false"
      APP_URL: ${APP_URL:?APP_URL is required}
      API_TOKEN_DEFAULT_EXPIRY_DAYS: ${API_TOKEN_DEFAULT_EXPIRY_DAYS:-30}
      MAIL_DRIVER: log
      APP_DATABASE_URL: postgresql://strata_app:${STRATA_APP_PASSWORD:?STRATA_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_URL: postgresql://strata_app:${STRATA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER:?TOKEN_HASH_PEPPER is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    command: ["bun", "node_modules/@getstrata/cli/cli.ts", "start"]

  worker:
    build: .
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV to local or production}
      AUTH_DEV_HEADERS: "false"
      APP_URL: ${APP_URL:?APP_URL is required}
      API_TOKEN_DEFAULT_EXPIRY_DAYS: ${API_TOKEN_DEFAULT_EXPIRY_DAYS:-30}
      MAIL_DRIVER: log
      APP_DATABASE_URL: postgresql://strata_app:${STRATA_APP_PASSWORD:?STRATA_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_URL: postgresql://strata_app:${STRATA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      QUEUE_DRIVER: redis
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER:?TOKEN_HASH_PEPPER is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bun", "node_modules/@getstrata/cli/cli.ts", "queue:work"]

  migrate:
    build: .
    profiles: [administration]
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV to local or production}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      APP_DATABASE_URL: postgresql://strata_app:${STRATA_APP_PASSWORD:?STRATA_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_URL: postgresql://strata_app:${STRATA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      STRATA_APP_PASSWORD: ${STRATA_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "node_modules/@getstrata/cli/cli.ts", "migrate"]
