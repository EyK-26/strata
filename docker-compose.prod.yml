# Production-shaped local stack. Set APP_ENV explicitly: local for a bootable
# stack, production only when the host also injects every secret secretsGuard
# requires (SESSION_SECRET, TOKEN_HASH_PEPPER, METRICS_TOKEN, and so on).

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV to local or production}
      APP_DEBUG: "false"
      AUTH_DEV_HEADERS: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      SESSION_SECRET: ${SESSION_SECRET:-}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "bun run cli migrate && bun run start"]

  worker:
    build: .
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV to local or production}
      AUTH_DEV_HEADERS: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      QUEUE_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bun", "run", "cli", "queue:work"]
