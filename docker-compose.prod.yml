# Production-shaped local stack for this repository. Default credentials match
# docker-compose.yml. A real deploy should inject DATABASE_URL, REDIS_URL,
# SESSION_SECRET, and AUTH_DEV_HEADERS=false from the host.

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: bun_testing_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bun_testing_test"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  app:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTH_DEV_HEADERS: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bun_testing_test
      REDIS_URL: redis://redis:6379
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: ["sh", "-c", "bun run cli migrate && bun run start"]

  worker:
    build: .
    environment:
      APP_ENV: production
      AUTH_DEV_HEADERS: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bun_testing_test
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bun", "run", "cli", "queue:work"]
