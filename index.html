<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>42 API</title>
        <style>
            :root {
                color-scheme: dark;
            }

            body {
                font-family: sans-serif;
                background-color: #000;
                color: #fff;
                margin: 0;
                padding: 2rem;
                line-height: 1.5;
            }

            h1,
            h2 {
                margin-top: 0;
            }

            section {
                margin-bottom: 2rem;
            }

            ul {
                padding-left: 1.25rem;
            }

            li {
                padding: 0.35rem 0;
            }

            a {
                color: #fff;
            }

            code,
            input,
            button {
                font: inherit;
            }

            form {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin: 0.75rem 0;
            }

            input {
                border: 1px solid #555;
                background-color: #111;
                color: #fff;
                padding: 0.5rem 0.75rem;
                border-radius: 0.35rem;
                min-width: 14rem;
            }

            button {
                border: 1px solid #777;
                background-color: #222;
                color: #fff;
                padding: 0.5rem 0.9rem;
                border-radius: 0.35rem;
                cursor: pointer;
            }

            .hint {
                color: #bbb;
                font-size: 0.95rem;
            }
        </style>
    </head>

    <body>
        <h1>42 API</h1>
        <p class="hint">
            Collection endpoints are linked below. For ID-based endpoints, use
            the forms so you can request a real numeric ID.
        </p>

        <section>
            <h2>Collections</h2>
            <ul>
                <li><a href="/characters">/characters</a></li>
                <li><a href="/nemesis">/nemesis</a></li>
                <li><a href="/secrets">/secrets</a></li>
                <li>
                    <a href="/characters-formatted">/characters-formatted</a>
                </li>
                <li><a href="/statistics">/statistics</a></li>
                <li><a href="/final-json-tree">/final-json-tree</a></li>
            </ul>
        </section>

        <section>
            <h2>Lookup by ID</h2>

            <form data-prefix="/characters/">
                <input
                    type="number"
                    min="1"
                    name="id"
                    placeholder="Character ID"
                    required
                />
                <button type="submit">Open /characters/:id</button>
            </form>

            <form data-prefix="/nemesis/">
                <input
                    type="number"
                    min="1"
                    name="id"
                    placeholder="Nemesis ID"
                    required
                />
                <button type="submit">Open /nemesis/:id</button>
            </form>

            <form data-prefix="/nemesis/character/">
                <input
                    type="number"
                    min="1"
                    name="id"
                    placeholder="Character ID"
                    required
                />
                <button type="submit">Open /nemesis/character/:id</button>
            </form>

            <form data-prefix="/secrets/">
                <input
                    type="number"
                    min="1"
                    name="id"
                    placeholder="Secret ID"
                    required
                />
                <button type="submit">Open /secrets/:id</button>
            </form>

            <form data-prefix="/secrets/nemesis/">
                <input
                    type="number"
                    min="1"
                    name="id"
                    placeholder="Nemesis ID"
                    required
                />
                <button type="submit">Open /secrets/nemesis/:id</button>
            </form>
        </section>

        <script>
            for (const form of document.querySelectorAll("form[data-prefix]")) {
                form.addEventListener("submit", (event) => {
                    event.preventDefault();
                    const prefix = form.getAttribute("data-prefix");
                    const input = form.querySelector('input[name="id"]');

                    if (!prefix || !input || !input.value) {
                        return;
                    }

                    window.location.href = `${prefix}${input.value}`;
                });
            }
        </script>
    </body>
</html>
