openapi: 3.1.0
info:
  title: WorkHub API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
paths:
  /auth/me:
    get:
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /auth/tokens:
    get:
      summary: List API tokens for the current user
      security:
        - bearerAuth: []
    post:
      summary: Create a new API token
      security:
        - bearerAuth: []
  /organizations:
    get:
      summary: List organizations
    post:
      summary: Create organization
  /projects:
    get:
      summary: List projects
    post:
      summary: Create project
  /reports/summary:
    get:
      summary: Cross-module summary report
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
