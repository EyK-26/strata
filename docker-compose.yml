services:
  postgres:
    image: postgres:18.4
    container_name: bun-testing-postgres-test
    environment:
      POSTGRES_DB: bun_testing_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-postgres-change-me
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bun_testing_test"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  redis:
    image: redis:7.4-alpine
    container_name: bun-testing-redis
    command: ["redis-server", "--requirepass", "dev-redis-change-me"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev-redis-change-me", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  mysql:
    image: mysql:8.4
    container_name: bun-testing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dev-mysql-change-me
      MYSQL_DATABASE: strata
      MYSQL_USER: strata
      MYSQL_PASSWORD: dev-mysql-change-me
    ports:
      - "127.0.0.1:33061:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ustrata -pdev-mysql-change-me --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  adminer:
    image: adminer:5.4.2
    profiles:
      - debug
    container_name: bun-testing-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
