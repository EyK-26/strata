services:
  postgres:
    image: postgres:18.4
    container_name: bun-testing-postgres-test
    environment:
      POSTGRES_DB: bun_testing_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    volumes:
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bun_testing_test"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  redis:
    image: redis:7.4-alpine
    container_name: bun-testing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  mysql:
    image: mysql:8.4
    container_name: bun-testing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hiroapp_job_board
      MYSQL_USER: hiroapp
      MYSQL_PASSWORD: hiroapp
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uhiroapp -phiroapp --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    image: oven/bun:1.4.0
    container_name: bun-testing-app
    working_dir: /workspace
    entrypoint: ["sh", "scripts/docker-dev-entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bun_testing_test
      REDIS_URL: redis://redis:6379
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - bun_node_modules:/workspace/node_modules
    command:
      [
        "sh",
        "-c",
        "bun run cli migrate && bun run cli seed && bun run start",
      ]

  worker:
    image: oven/bun:1.4.0
    container_name: bun-testing-worker
    working_dir: /workspace
    entrypoint: ["sh", "scripts/docker-dev-entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bun_testing_test
      REDIS_URL: redis://redis:6379
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/workspace
      - bun_node_modules:/workspace/node_modules
    command: ["bun", "run", "cli", "queue:work"]

  adminer:
    image: adminer:5.4.2
    container_name: bun-testing-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  bun_node_modules:
