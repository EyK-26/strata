# Semgrep SAST rules for Strata

rules:
  - id: strata-hardcoded-bearer-token
    message: Avoid hard-coded bearer tokens outside test fixtures.
    severity: ERROR
    languages: [typescript]
    patterns:
      - pattern-regex: Bearer strata-[a-z-]+
    paths:
      exclude:
        - tests/
        - src/domain/
