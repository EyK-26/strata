name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (example v1.0.0)
        required: true
        type: string
      channel:
        description: Explicit release channel (prereleases require next at the tag ref)
        required: true
        default: stable
        type: choice
        options: [stable, next]
      resume_run_id:
        description: Original next workflow run retaining the exact candidate artifacts
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}

concurrency:
  group: release-${{ github.repository }}-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  release-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      packages: read
    outputs:
      channel: ${{ steps.policy.outputs.channel }}
      version: ${{ steps.policy.outputs.version }}
      candidate_artifact: ${{ steps.policy.outputs.candidate_artifact }}
      baseline: ${{ steps.policy.outputs.baseline }}
      source_commit: ${{ steps.policy.outputs.source_commit }}
      policy: ${{ steps.policy.outputs.policy }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Verify source, channel and exact-head checks
        id: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: bun --no-env-file scripts/verify-workflow-release.ts
  # Notes and the GitHub Release must not wait on Docker Hub. v0.7.3 timed out
  # pulling moby/buildkit:buildx-stable-1 during setup-buildx, so the release
  # notes never ran even though npm had already published. They do wait on
  # npm: do not cut a GitHub Release for a version that is not on the registry.
  github-release:
    needs: [publish-framework, release-policy]
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL_BASELINE: ${{ needs['release-policy'].outputs.baseline }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs['release-policy'].outputs.source_commit }}

      - name: Set up Bun for next channel verification
        if: ${{ needs['release-policy'].outputs.channel == 'next' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Create GitHub Release
        if: ${{ needs['release-policy'].outputs.channel == 'stable' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true

      - name: Create next GitHub prerelease
        if: ${{ needs['release-policy'].outputs.channel == 'next' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ fromJSON(needs['release-policy'].outputs.policy).github.prerelease }}
          make_latest: ${{ fromJSON(needs['release-policy'].outputs.policy).github.makeLatest }}

      - name: Verify next GitHub release and stable pointer
        if: ${{ needs['release-policy'].outputs.channel == 'next' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/release-channel-guard.ts after-github

      - name: Retain GitHub channel receipt
        if: ${{ always() && needs['release-policy'].outputs.channel == 'next' }}
        uses: actions/upload-artifact@v6
        with:
          name: github-channel-${{ github.run_id }}-${{ github.run_attempt }}
          path: .m6-channel-after-github.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  container:
    needs: [publish-framework, release-policy]
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL_BASELINE: ${{ needs['release-policy'].outputs.baseline }}
      RELEASE_CONTAINER_ALIAS: ${{ fromJSON(needs['release-policy'].outputs.policy).containerAliases[0] || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs['release-policy'].outputs.source_commit }}

      - name: Set up Bun for next channel verification
        if: ${{ needs['release-policy'].outputs.channel == 'next' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set container image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Verify container tag ownership before effects
        if: ${{ needs['release-policy'].outputs.channel == 'next' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/release-channel-guard.ts before-container

      # Same `docker build` path as CI `docker-install`. Do not boot Buildx:
      # that pulls moby/buildkit from Docker Hub before the app image builds.
      - name: Build and push image
        run: |
          set -eu
          image="${IMAGE}:${RELEASE_TAG}"
          latest="${IMAGE}:latest"
          case "${RELEASE_CHANNEL}:${RELEASE_CONTAINER_ALIAS-}" in
            stable:latest) build_tags=(--tag "$image" --tag "$latest") ;;
            next:) build_tags=(--tag "$image") ;;
            *) echo "Unverified container release channel" >&2; exit 1 ;;
          esac
          attempt=1
          while [ "$attempt" -le 4 ]; do
            if docker build --pull "${build_tags[@]}" .; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 8))
            attempt=$((attempt + 1))
          done
          docker push "$image"
          if [ "$RELEASE_CHANNEL" = stable ]; then docker push "$latest"; fi

      - name: Verify next container and stable pointer
        if: ${{ needs['release-policy'].outputs.channel == 'next' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/release-channel-guard.ts after-container

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Retain container channel receipts
        if: ${{ always() && needs['release-policy'].outputs.channel == 'next' }}
        uses: actions/upload-artifact@v6
        with:
          name: container-channel-${{ github.run_id }}-${{ github.run_attempt }}
          path: .m6-channel-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # npm publish must not wait on GHCR: an earlier image failure blocked publication.
  # Keep every framework package manifest in the Docker install stage.
  # publish_package skips versions already on npm, so workflow_dispatch can
  # retry a failed or partial publish without double-publishing.
  # npm trusted publishing (GitHub OIDC). Job permissions replace workflow
  # permissions: id-token: write is required; do not set NODE_AUTH_TOKEN.
  # setup-node registry-url writes an empty _authToken that blocks OIDC.
  publish-framework:
    needs: [release-policy]
    if: ${{ github.event_name == 'push' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      checks: read
      packages: read
    env:
      CANDIDATE_SOURCE_RUN_ID: ${{ inputs.resume_run_id || github.run_id }}
      RELEASE_CHANNEL_BASELINE: ${{ needs['release-policy'].outputs.baseline }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs['release-policy'].outputs.source_commit }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install npm CLI for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun dedupe
          git diff --exit-code -- bun.lock

      - name: Start services
        run: docker compose up -d postgres mysql redis --wait

      - name: Check tag matches package versions
        run: |
          for pkg in \
            packages/strata-core/package.json \
            packages/strata-bootstrap/package.json \
            packages/strata-cli/package.json \
            packages/strata-starter/package.json \
            packages/create-strata/package.json
          do
            version="$(node -p "require('./${pkg}').version")"
            if [ "v${version}" != "${RELEASE_TAG}" ]; then
              echo "Tag ${RELEASE_TAG} does not match ${pkg} version ${version}" >&2
              exit 1
            fi
          done

      - name: Validate release quality gate
        env:
          DATABASE_URL: postgresql://postgres:dev-postgres-change-me@localhost:54329/bun_testing_test
          MIGRATION_DATABASE_URL: postgresql://postgres:dev-postgres-change-me@localhost:54329/hiroapp_test
          APP_DATABASE_URL: postgresql://strata_app:dev-strata-app-change-me@localhost:54329/hiroapp_test
          REDIS_URL: redis://:dev-redis-change-me@localhost:6379
          SKIP_FIXTURE_TEST_BOOTSTRAP: 1
          CACHE_DRIVER: array
          QUEUE_DRIVER: sync
          FEATURE_SCIM: "true"
          SCIM_BEARER_TOKEN: strata-scim-test-token
          ADMIN_API_TOKEN: strata-admin-test-token
          MEMBER_API_TOKEN: strata-member-test-token
        run: |
          scripts/with-host-env.sh sh -c "
            bun run build:framework &&
            bun run build:bootstrap &&
            STRATA_SCHEMA=fixture bun run cli migrate:fresh --seed &&
            bun run validate:ci
          "

      - name: Build framework packages
        run: |
          bun run --filter @getstrata/core build
          bun run --filter @getstrata/bootstrap build
          bun run --filter @getstrata/starter build
          bun run --filter create-strata build

      - name: Verify retained candidate source run
        if: ${{ needs['release-policy'].outputs.channel == 'next' && inputs.resume_run_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-env-file scripts/candidate-release.ts verify-source

      - name: Download original candidate artifacts
        if: ${{ needs['release-policy'].outputs.channel == 'next' && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs['release-policy'].outputs.candidate_artifact }}
          path: .candidate
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: Pack next candidate once
        if: ${{ needs['release-policy'].outputs.channel == 'next' && inputs.resume_run_id == '' }}
        run: bun --no-env-file scripts/candidate-release.ts pack

      - name: Retain immutable next candidate artifacts
        if: ${{ needs['release-policy'].outputs.channel == 'next' && inputs.resume_run_id == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs['release-policy'].outputs.candidate_artifact }}
          path: |
            .candidate/*.tgz
            .candidate/candidate-ledger.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Recheck actual main and exact-head gates before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: bun --no-env-file scripts/verify-workflow-release.ts

      - name: Publish to npm
        run: |
          if [ "$RELEASE_CHANNEL" = next ]; then
            bun --no-env-file scripts/candidate-release.ts publish
            exit $?
          fi
          publish_package() {
            pkg_dir="$1"
            name="$(node -p "require('./${pkg_dir}/package.json').name")"
            version="$(node -p "require('./${pkg_dir}/package.json').version")"
            local publication_status
            publication_status="$(bun scripts/package-publication-status.ts "$name" "$version")" || return 1
            case "$publication_status" in
              published)
                echo "Skipping ${name}@${version} (already on npm)"
                return 0
                ;;
              unpublished)
                npm publish --workspace "${name}" --access public --provenance
                ;;
              *)
                echo "Cannot verify publication state for ${name}@${version}" >&2
                return 1
                ;;
            esac
          }

          publish_package packages/strata-core
          publish_package packages/strata-bootstrap
          publish_package packages/strata-cli
          publish_package packages/strata-starter
          publish_package packages/create-strata

      - name: Retain candidate attempt outcome
        if: ${{ always() && needs['release-policy'].outputs.channel == 'next' }}
        uses: actions/upload-artifact@v6
        with:
          name: candidate-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate/publication-*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
