name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start services
        run: docker compose up -d postgres redis --wait

      - name: Install dependencies and run checks
        run: |
          docker compose run --rm -e QUEUE_DRIVER=sync -e REDIS_URL=redis://redis:6379 app sh -c "
            bun install --frozen-lockfile &&
            bun run cli migrate:fresh --seed &&
            bun run check &&
            bun run lint &&
            bun run cli openapi:validate &&
            bun run cli openapi:check &&
            bun run test:all
          "

      - name: Start app for smoke tests
        run: |
          docker compose up -d app --wait
          sleep 3

      - name: Run smoke tests
        run: |
          docker compose exec -T app sh -c "BASE_URL=http://localhost:3000 bun run smoke"
