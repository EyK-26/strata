name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker install stage
        run: docker build --pull --target install -t strata-install .

  test-parallel:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Start services
        run: docker compose up -d postgres mysql redis --wait

      - name: Run Bun 1.4 parallel unit tests
        env:
          SKIP_FIXTURE_TEST_BOOTSTRAP: 1
          PORT: "3000"
          CACHE_DRIVER: array
          QUEUE_DRIVER: sync
          FEATURE_SCIM: "true"
          SCIM_BEARER_TOKEN: strata-scim-test-token
          ADMIN_API_TOKEN: strata-admin-test-token
          MEMBER_API_TOKEN: strata-member-test-token
        run: |
          bun install --frozen-lockfile
          bun dedupe
          bun run build:framework
          bun run build:bootstrap
          bun run test:parallel

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Start services
        run: docker compose up -d postgres mysql redis --wait

      - name: Install dependencies and run checks
        env:
          SKIP_FIXTURE_TEST_BOOTSTRAP: 1
          PORT: "3000"
          CACHE_DRIVER: array
          QUEUE_DRIVER: sync
          FEATURE_SCIM: "true"
          SCIM_BEARER_TOKEN: strata-scim-test-token
          ADMIN_API_TOKEN: strata-admin-test-token
          MEMBER_API_TOKEN: strata-member-test-token
          DATABASE_URL: postgresql://postgres:dev-postgres-change-me@localhost:54329/bun_testing_test
          MIGRATION_DATABASE_URL: postgresql://postgres:dev-postgres-change-me@localhost:54329/hiroapp_test
          APP_DATABASE_URL: postgresql://strata_app:dev-strata-app-change-me@localhost:54329/hiroapp_test
          REDIS_URL: redis://:dev-redis-change-me@localhost:6379
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun dedupe
          bun run build:framework
          bun run build:bootstrap
          scripts/with-host-env.sh sh -c "
            STRATA_SCHEMA=fixture bun run cli migrate:fresh --seed &&
            bun run validate:ci &&
            bun run verify:framework
          "

      - name: Set up release Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify archive packing and publication dry-run with the release toolchain
        run: |
          npm install -g "npm@$(cat .npm-version)"
          bun run build:starter
          bun run build:create-strata
          RELEASE_TAG="v$(node -p "require('./packages/strata-core/package.json').version")" \
            bun scripts/release-publication.ts pack "$RUNNER_TEMP/release-archives"
          RELEASE_TAG="v$(node -p "require('./packages/strata-core/package.json').version")" \
            bun scripts/release-publication.ts dry-run "$RUNNER_TEMP/release-archives"

      - name: Audit dependencies
        run: bun run deps:audit
