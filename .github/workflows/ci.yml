name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d postgres redis --wait

      - name: Install dependencies and run checks
        run: |
          docker compose run --rm -e QUEUE_DRIVER=sync -e REDIS_URL=redis://redis:6379 app sh -c "
            bun install --frozen-lockfile &&
            bun run cli migrate:fresh --seed &&
            bun run check &&
            bun run test:all
          "
