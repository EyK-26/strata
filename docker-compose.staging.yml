# Staging overlay. APP_ENV=staging runs production secret checks, so inject
# SESSION_SECRET (and JWT_SECRET if you mint JWTs) from the host. Do not rely
# on app-name fallbacks.

services:
  app:
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      AUTH_DEV_HEADERS: "false"
    command:
      [
        "sh",
        "-c",
        "bun run cli migrate && bun run cli seed && bun run start",
      ]

  worker:
    environment:
      APP_ENV: staging
      AUTH_DEV_HEADERS: "false"
